<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>SKLAD Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #182b44;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #1757a7; }
    #reader {
      max-width: 480px;
      margin: 20px auto;
    }
    button {
      padding: 14px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #1757a7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin: 20px auto;
      padding: 16px;
      background: white;
      border-radius: 12px;
      max-width: 480px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>📦 SKLAD Scanner</h1>
  <p>Skanuj kod QR lub kod kreskowy produktu</p>

  <div id="reader"></div>

  <div id="result">
    Oczekiwanie na skanowanie...
  </div>

  <button onclick="startScanner()">📷 Uruchom kamerę</button>
  <button onclick="manualCode()">⌨ Wpisz kod</button>
<button id="openSkladBtn"
        style="display:none"
        onclick="openSklad(lastCode)">
  📦 Otwórz SKLAD
</button>
  <script>
  const SKLAD_URL =
  'https://script.google.com/macros/s/AKfycbySCfVwUwcFhw1RLNv1yjr8j82dizZ3mF31Zd6PCN9TDKliEX_sUca9HOGNiik4I4Rs/exec';

function openSklad(code) {
  const url = SKLAD_URL + '?scan=' +
    encodeURIComponent(code);

  window.location.href = url;
}  
    let scanner = null;
    let scanning = false;
let lastCode = '';
    async function startScanner() {
      if (scanning) return;

      if (typeof Html5Qrcode === 'undefined') {
        document.getElementById('result').textContent =
          'Błąd ładowania biblioteki skanera';
        return;
      }

      scanner = new Html5Qrcode('reader');

      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 250 },
          onCodeScanned,
          () => {}
        );
        scanning = true;
      } catch (error) {
        document.getElementById('result').textContent =
          'Błąd kamery: ' + error;
      }
    }

    async function onCodeScanned(code) {
  if (!scanning) return;
  scanning = false;

  lastCode = code;
  document.getElementById('result').textContent =
    'Zeskanowany kod: ' + code;

  document.getElementById('openSkladBtn').style.display =
    'inline-block';

  await scanner.stop().catch(() => {});
}
    function manualCode() {
      const code = prompt('Wpisz kod produktu:');
      if (code && code.trim()) {
        document.getElementById('result').textContent =
          lastCode = code.trim();
document.getElementById('openSkladBtn').style.display =
  'inline-block';
          'Wpisany kod: ' + code.trim();
      }
    }
  </script>
</body>
</html>
